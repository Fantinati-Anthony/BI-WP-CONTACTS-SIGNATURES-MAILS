name: Build WordPress plugin ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VER=$(grep -E "^[[:space:]]*\*[[:space:]]*Version:" bi-signatures/bi-signatures.php | head -1 | sed -E 's/.*Version:[[:space:]]*//; s/[[:space:]]+$//')
          if [ -z "$VER" ]; then
            echo "Could not parse Version header from bi-signatures/bi-signatures.php" >&2
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VER — commit: $SHORT_SHA"

      - name: Build plugin ZIP
        id: build
        run: |
          mkdir -p build
          ZIP_NAME="bi-signatures-v${{ steps.version.outputs.version }}.zip"
          zip -r "build/${ZIP_NAME}" bi-signatures \
            -x "bi-signatures/.git*" \
            -x "bi-signatures/node_modules/*" \
            -x "bi-signatures/tests/*" \
            -x "bi-signatures/.github/*" \
            -x "bi-signatures/.DS_Store"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: build/${{ steps.build.outputs.zip_name }}
          retention-days: 90
          if-no-files-found: error

      - name: Create or update versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Plugin WordPress **BI Contacts & Signatures Mails** v${{ steps.version.outputs.version }}

            Dernier commit inclus : `${{ steps.version.outputs.short_sha }}`
            Build du : ${{ github.event.head_commit.timestamp }}

            Téléchargez le fichier `.zip` ci-dessous et importez-le dans WordPress via *Extensions → Ajouter → Téléverser une extension*.
          files: build/${{ steps.build.outputs.zip_name }}
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
